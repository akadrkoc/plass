# One command starts everything:  docker compose up --build
# then open http://localhost:3000  (API docs: http://localhost:3000/swagger-ui.html)
name: plass

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plass
      POSTGRES_USER: plass
      POSTGRES_PASSWORD: plass
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plass -d plass"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/plass
      DB_USERNAME: plass
      DB_PASSWORD: plass
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789}
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
