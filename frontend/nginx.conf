server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The React app: unknown paths fall back to index.html so client-side routes work on refresh.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets never change, so browsers may cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API and API docs are served by the Spring Boot container.
    location ~ ^/(api|swagger-ui|v3/api-docs)(/|\.html|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
